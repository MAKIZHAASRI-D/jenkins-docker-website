<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins CI/CD Website</title>
    <style>
        :root {
            color-scheme: light;
            --blue-900: #12355b;
            --blue-700: #1d70a2;
            --blue-100: #dff3ff;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background: linear-gradient(135deg, var(--blue-100), #f4fbff);
            color: var(--blue-900);
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            background: var(--white);
            border: 1px solid #b9e2f5;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(18, 53, 91, 0.14);
            max-width: 640px;
            padding: 56px 40px;
            text-align: center;
            width: 100%;
        }

        .eyebrow {
            color: var(--blue-700);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            margin: 0 0 16px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            line-height: 1.1;
            margin: 0 0 20px;
        }

        .message {
            color: #42627c;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0 auto 28px;
            max-width: 460px;
        }

        .version {
            background: var(--blue-700);
            border-radius: 999px;
            color: var(--white);
            display: inline-block;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Automated deployment is working</p>
        <h1>Welcome to Jenkins CI/CD!</h1>
        <p class="message">This website was built into a Docker image and deployed through a Jenkins pipeline.</p>
        <p class="version">Version 2</p>
    </main>
</body>
</html>
